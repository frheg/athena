name: test
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: athena }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
        env: { ATHENA_TEST_DATABASE_URL: "postgres://postgres:test@localhost:5432/athena?sslmode=disable" }
  ui:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
