# On a version tag (v0.1.0), build every image and publish it to ghcr.io/<owner>/athena-<name>:<version>.
name: publish
on:
  push: { tags: ["v*"] }
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [core, mcp-web, mcp-sources, mcp-everyday, mcp-notes, mcp-cluster-read, mcp-cluster-act, memory, notify, files, ui, speech, pose]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - name: build and push
        env: { TARGET: "${{ matrix.target }}", VERSION: "${{ github.ref_name }}", OWNER: "${{ github.repository_owner }}" }
        run: |
          image="ghcr.io/${OWNER}/athena-${TARGET}:${VERSION#v}"
          if [ "$TARGET" = ui ] || [ "$TARGET" = speech ] || [ "$TARGET" = pose ]; then
            docker buildx build --push -t "$image" "$TARGET" # its own folder
          else
            docker buildx build --push --build-arg VERSION="${VERSION#v}" --target "$TARGET" -t "$image" .
          fi
